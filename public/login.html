<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrar — Santo Sabor</title>
<style>
:root{--primaria:#D97706;--fundo:#FFF8F0;--texto:#3E2723;--borda:#EAE0D6;}
body{font-family:system-ui,sans-serif;background:var(--fundo);color:var(--texto);margin:0;padding:0}
.container{max-width:400px;margin:0 auto;padding:2rem 1rem}
input{width:100%;padding:.7rem;border:1px solid var(--borda);border-radius:.75rem;margin:.25rem 0 1rem;font-size:1rem}
.btn{background:var(--primaria);color:#fff;border:none;padding:.85rem;border-radius:.75rem;font-size:1rem;font-weight:700;width:100%;cursor:pointer}
</style>
</head>
<body>
<header style="background:linear-gradient(135deg,#D97706,#92400E);color:#fff;padding:1.5rem;text-align:center;"><strong>Santo Sabor</strong></header>
<main class="container" aria-label="Login e Cadastro">
  <h1><a href="index.html" style="color:#fff;text-decoration:none">Santo Sabor</a></h1>
  <h2>Entrar</h2>
  <form onsubmit="event.preventDefault(); alert('Login realizado. Redirecionando...'); window.location.href='index.html';" aria-label="Formulário de login">
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" required aria-required="true">
    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Sua senha" required aria-required="true">
    <button class="btn" type="submit">Entrar</button>
  </form>
  <p style="text-align:center;margin-top:1rem;font-size:.9rem;color:#6D4C41">Não tem conta? <a href="#" onclick="alert('Cadastro será implementado no backend')">Criar conta</a></p>
  <nav style="margin-top:2rem;text-align:center;">
    <a href="index.html" style="display:inline-block;margin:.25rem;padding:.5rem 1rem;background:#fff;border:1px solid var(--borda);border-radius:.5rem;text-decoration:none;color:var(--texto);font-size:.9rem">Home</a>
    <a href="produto.html" style="display:inline-block;margin:.25rem;padding:.5rem 1rem;background:#fff;border:1px solid var(--borda);border-radius:.5rem;text-decoration:none;color:var(--texto);font-size:.9rem">Produto</a>
    <a href="carrinho.html" style="display:inline-block;margin:.25rem;padding:.5rem 1rem;background:#fff;border:1px solid var(--borda);border-radius:.5rem;text-decoration:none;color:var(--texto);font-size:.9rem">Carrinho</a>
    <a href="checkout.html" style="display:inline-block;margin:.25rem;padding:.5rem 1rem;background:#fff;border:1px solid var(--borda);border-radius:.5rem;text-decoration:none;color:var(--texto);font-size:.9rem">Checkout</a>
    <a href="acompanhamento.html" style="display:inline-block;margin:.25rem;padding:.5rem 1rem;background:#fff;border:1px solid var(--borda);border-radius:.5rem;text-decoration:none;color:var(--texto);font-size:.9rem">Acompanhamento</a>
  </nav>
</main>
</body>
</html>
