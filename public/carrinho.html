<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Carrinho — Santo Sabor</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet"><style>:root{--tema:#D97706;--fundo:#FFF8F0;--card:#fff;--texto:#3E2723;--borda:#EAE0D6;--cinza:#6D4C41;}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Poppins',system-ui,sans-serif;background:var(--fundo);color:var(--texto)}
.container{max-width:720px;margin:0 auto;padding:1rem}
header{background:linear-gradient(135deg,#D97706,#92400E);color:#fff;padding:1.2rem;text-align:center}
header h1{font-size:1.2rem;font-weight:900}
.item{background:var(--card);border:1px solid var(--borda);border-radius:.7rem;padding:.75rem;margin-bottom:.5rem;display:flex;gap:.75rem;align-items:center}
.item img{width:70px;height:70px;object-fit:cover;border-radius:.4rem;flex-shrink:0}
.item h3{font-size:.95rem;font-weight:700}
.item .price{font-weight:700;color:var(--tema)}
.actions{display:flex;gap:.35rem;margin-top:.35rem}
.actions button{border:1px solid var(--borda);background:#fff;padding:.35rem .55rem;border-radius:.4rem;font-size:.75rem;cursor:pointer}
.totals{background:var(--card);border:1px solid var(--borda);border-radius:.7rem;padding:1rem;margin-top:.75rem}
.totals table{width:100%;font-size:.9rem;border-collapse:collapse}
.totals td{padding:.25rem 0}
.totals td:nth-child(2){text-align:right;font-weight:700}
.btn{display:block;background:var(--tema);color:#fff;border:none;padding:.85rem;border-radius:.7rem;font-weight:700;text-align:center;margin-top:.75rem;text-decoration:none}
.nav{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0;margin-bottom:.5rem}
.nav a{flex:0 0 auto;background:#fff;border:1px solid var(--borda);padding:.35rem .7rem;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--texto)}
</style></head>
<body><header><h1>Carrinho — Santo Sabor</h1></header>
<main class="container" aria-label="Carrinho">
  <nav class="nav" aria-label="Links"><a href="index.html">Home</a><a href="menu.html">Cardápio</a><a href="produto.html">Produto</a><a href="carrinho.html" class="active">Carrinho</a><a href="checkout.html">Checkout</a><a href="acompanhamento.html">Acompanhar</a><a href="login.html">Entrar</a></nav>
  <div id="lista"></div>
  <div class="totals"><table><tr><td>Subtotal</td><td id="sub">R$ 0,00</td></tr><tr><td>Entrega</td><td>R$ 5,00</td></tr><tr style="font-weight:700;font-size:1.05rem"><td>Total</td><td id="tot">R$ 0,00</td></tr></table></div>
  <a href="checkout.html" class="btn">Ir para checkout</a>
  <a href="menu.html" class="btn" style="background:var(--fundo);color:var(--texto);border:1px solid var(--borda);margin-top:.25rem">Voltar ao cardápio</a>
</main>
<script>
function fmt(n){return 'R$ '+n.toFixed(2).replace('.',',');}
function render(){
  const items=JSON.parse(localStorage.getItem('santosabor_cart')||'[]');
  const c=document.getElementById('lista');
  if(!items.length){c.innerHTML='<p style="padding:1rem;color:var(--cinza)">Carrinho vazio. <a href="menu.html">Ver cardápio</a></p>';document.getElementById('sub').textContent='R$ 0,00';document.getElementById('tot').textContent='R$ 5,00';return;}
  let html='',sub=0;
  items.forEach((it,i)=>{sub+=it.preco*it.qtd; html+=`<div class="item"><img src="public/bife-milanesa-m.png" alt="${it.nome}" loading="lazy" onerror="this.style.display='none'"><div><h3>${it.nome}</h3><div class="price">${fmt(it.preco)} — ${it.tam}</div><div class="actions"><button onclick="mudar(${i},-1)">-</button><span>${it.qtd}</span><button onclick="mudar(${i},1)">+</button><button onclick="remover(${i})">Remover</button></div></div></div>`;});
  c.innerHTML=html;
  document.getElementById('sub').textContent=fmt(sub);
  document.getElementById('tot').textContent=fmt(sub+5);
}
function mudar(i,d){const items=JSON.parse(localStorage.getItem('santosabor_cart')||'[]');items[i].qtd=Math.max(1,items[i].qtd+d);localStorage.setItem('santosabor_cart',JSON.stringify(items));render();}
function remover(i){const items=JSON.parse(localStorage.getItem('santosabor_cart')||'[]');items.splice(i,1);localStorage.setItem('santosabor_cart',JSON.stringify(items));render();}
render();
</script></body></html>
